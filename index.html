<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Quiet Things — Coloring</title>
  <style>
    :root { --ink:#39423b; --moss:#738275; --paper:#faf8f1; --cream:#f2eee3; --peach:#dba98f; --line:#3f4940; --shadow:rgba(70,76,60,.13); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#e8e5d9; font-family:Georgia, 'Times New Roman', serif; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:290px minmax(0,1fr); }
    aside { padding:34px 28px; background:#f5f1e7; border-right:1px solid #ded9cd; display:flex; flex-direction:column; }
    .brand { display:flex; align-items:center; gap:11px; font-size:21px; letter-spacing:.02em; }
    .brand-mark { width:29px; height:29px; background:var(--peach); border-radius:50% 50% 50% 6px; transform:rotate(-35deg); position:relative; }
    .brand-mark:after { content:''; width:8px; height:8px; border:2px solid var(--ink); border-radius:50%; position:absolute; top:8px; left:8px; }
    h1 { font-size:29px; font-weight:normal; line-height:1.1; margin:45px 0 8px; }
    .intro { color:#73766d; font-size:14px; line-height:1.5; margin:0 0 30px; }
    .section-title { font-family:Arial,sans-serif; text-transform:uppercase; letter-spacing:.12em; font-weight:bold; font-size:10px; color:#84877e; margin:0 0 12px; }
    .page-list { display:grid; gap:8px; }
    .page-choice { display:grid; grid-template-columns:40px 1fr; align-items:center; gap:11px; text-align:left; background:transparent; border:1px solid transparent; border-radius:12px; padding:8px; font-size:15px; }
    .page-choice:hover { background:#ede9dd; }
    .page-choice.active { background:#e3eadf; border-color:#cbd7c7; }
    .mini { width:40px; height:40px; background:#fffdf7; border:1px solid #d8d3c8; border-radius:8px; display:grid; place-items:center; overflow:hidden; }
    .mini svg { width:34px; height:34px; stroke:#485049; fill:none; stroke-width:2; }
    .palette { margin-top:34px; }
    .swatches { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; }
    .swatch { width:31px; height:31px; padding:0; border-radius:50%; border:2px solid rgba(61,70,61,.12); transition:transform .15s; }
    .swatch:hover { transform:scale(1.12); }
    .swatch.selected { outline:2px solid var(--ink); outline-offset:3px; }
    .custom { display:flex; gap:10px; align-items:center; margin-top:16px; font-family:Arial,sans-serif; font-size:12px; color:#777b72; }
    input[type=color] { width:32px; height:27px; padding:0; border:0; border-radius:6px; background:none; cursor:pointer; }
    .side-note { margin-top:auto; padding-top:28px; font-size:12px; color:#85877f; line-height:1.55; }
    main { min-width:0; display:grid; grid-template-rows:auto 1fr; background:var(--cream); }
    header { height:78px; padding:0 42px; border-bottom:1px solid #ded9cd; background:rgba(250,248,241,.77); display:flex; align-items:center; justify-content:space-between; }
    .now { font-size:16px; font-style:italic; }
    .controls { display:flex; gap:10px; }
    .control { background:#fbfaf5; border:1px solid #d9d5ca; border-radius:20px; padding:9px 15px; font-family:Arial,sans-serif; font-size:12px; }
    .control:hover { background:#eeeade; }
    .clear { color:#a05e50; }
    .workspace { display:grid; place-items:center; padding:42px; overflow:auto; background:radial-gradient(#d8d4c9 1px, transparent 1px) 0 0/18px 18px; }
    .canvas-card { background:#fffefb; width:min(720px, 100%); aspect-ratio:1.12; box-shadow:0 18px 40px var(--shadow); border:1px solid #e6e1d7; padding:clamp(16px,3vw,32px); position:relative; }
    svg#coloring { width:100%; height:100%; display:block; overflow:visible; }
    .color-area { fill:#fffefb; stroke:var(--line); stroke-width:4; stroke-linejoin:round; cursor:pointer; transition:filter .15s; }
    .color-area:hover { filter:brightness(.94); }
    .line { fill:none; stroke:var(--line); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
    .detail { fill:none; stroke:var(--line); stroke-width:3; stroke-linecap:round; pointer-events:none; }
    .spark { fill:var(--line); pointer-events:none; }
    .instruction { position:absolute; bottom:13px; left:0; width:100%; text-align:center; font-family:Arial,sans-serif; color:#85877e; font-size:11px; letter-spacing:.04em; }
    @media (max-width:700px) { .app { grid-template-columns:1fr; } aside { padding:20px; border-right:0; border-bottom:1px solid #ded9cd; } h1,.intro,.side-note { display:none; } .palette { margin-top:20px; } .page-list { grid-template-columns:repeat(3,1fr); } .page-choice { grid-template-columns:35px 1fr; padding:6px; font-size:13px; } .mini { width:35px; height:35px; } header { height:60px; padding:0 18px; } .workspace { padding:18px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><span class="brand-mark"></span><span>little quiet things</span></div>
      <h1>A little time to color.</h1>
      <p class="intro">Choose a page, pick a peaceful shade, and tap an open space to bring it to life.</p>
      <section><p class="section-title">Coloring pages</p><div class="page-list" id="pageList"></div></section>
      <section class="palette"><p class="section-title">Your palette</p><div class="swatches" id="swatches"></div><label class="custom"><input type="color" id="customColor" value="#b8c6a3"> make your own shade</label></section>
      <p class="side-note">Your coloring stays here while you play.<br>Take a slow breath between colors.</p>
    </aside>
    <main>
      <header><span class="now" id="pageTitle">A garden morning</span><div class="controls"><button class="control" id="resetBtn">Start over</button><button class="control clear" id="clearBtn">Clear colors</button></div></header>
      <section class="workspace"><div class="canvas-card"><svg id="coloring" viewBox="0 0 720 640" aria-label="Interactive coloring page"></svg><div class="instruction">PICK A COLOR, THEN CLICK A WHITE SPACE</div></div></section>
    </main>
  </div>
  <script>
    const palette = ['#b8c6a3','#d8a88d','#8ca6a1','#e1c873','#c6a4ba','#93aac8','#d58f91','#829475','#f0d7ae','#9c8fb1','#656e62','#fbfaf2'];
    const pages = [
      { name:'A garden morning', icon:'flower', make:garden },
      { name:'Tea for one', icon:'cup', make:tea },
      { name:'By the sea', icon:'sun', make:sea }
    ];
    let selected = palette[0], current = 0;
    const svg = document.getElementById('coloring');
    function area(id, d) { return `<path class="color-area" data-id="${id}" d="${d}" />`; }
    function garden() { return `
      ${area('sky','M66 66H654V544H66Z')}
      <circle class="color-area" data-id="sun" cx="540" cy="137" r="45"/>
      ${area('hills','M66 544V442c72-67 135-37 192 5 57 42 112 17 161-21 51-40 119-36 235 28v90Z')}
      <path class="line" d="M66 544h588M66 442c72-67 135-37 192 5 57 42 112 17 161-21 51-40 119-36 235 28"/>
      <path class="detail" d="M540 70v24m0 86v24m67-67h-24m-86 0h-24m91 43-17-17m-58-58-17-17m0 92-17 17m58-58 17-17"/>
      <path class="line" d="M186 544V385m132 159V319m166 225V350m128 194V412"/>
      ${area('flower1','M186 385c-30-31 9-57 24-25 15-32 54-6 24 25 30 31-9 57-24 25-15 32-54 6-24-25Z')}
      <circle class="color-area" data-id="flower1-center" cx="210" cy="385" r="9"/>
      ${area('flower2','M318 319c-34-35 10-64 27-28 17-36 61-7 27 28 34 35-10 64-27 28-17 36-61 7-27-28Z')}
      <circle class="color-area" data-id="flower2-center" cx="345" cy="319" r="10"/>
      ${area('flower3','M484 350c-32-33 10-61 25-27 16-34 58-6 25 27 33 33-9 61-25 27-16 34-58 6-25-27Z')}
      <circle class="color-area" data-id="flower3-center" cx="509" cy="350" r="9"/>
      ${area('flower4','M612 412c-25-26 8-49 20-21 12-28 45-5 20 21 25 26-8 49-20 21-12 28-45 5-20-21Z')}
      <circle class="color-area" data-id="flower4-center" cx="632" cy="412" r="8"/>
      <path class="detail" d="M186 465c-24-18-38-7-42 8m201-91c25-19 40-6 43 11m121 40c24-18 39-5 42 10m81 27c-20-16-33-5-35 8M108 164c17-15 34-15 51 0m19 43c14-12 28-12 42 0"/>
    `; }
    function tea() { return `
      ${area('wall','M66 66H654V490H66Z')}
      ${area('table','M66 490H654V574H66Z')}
      ${area('window-sky','M113 116H293V296H113Z')}
      <path class="line" d="M98 101h210v210H98Z M203 116v180m-90-90h180"/>
      ${area('curtain-left','M82 88c29 45 25 163 16 218 27-15 54-21 78-18V88Z')}
      ${area('curtain-right','M324 88c-29 45-25 163-16 218-27-15-54-21-78-18V88Z')}
      <path class="detail" d="M98 101c28 30 53 35 78 0m54 0c25 35 50 30 78 0"/>
      ${area('teapot','M382 366c-8-76 33-118 85-118 59 0 91 53 63 118Z')}
      ${area('teapot-lid','M414 248c16-26 49-26 65 0Z')}
      <path class="line" d="M530 279c69-5 73 105-4 103M382 285c-44 9-68 41-76 78 26 7 51-1 76-22"/>
      <path class="detail" d="M422 328c14 9 30 9 44 0"/>
      ${area('cup','M213 414h104v52c0 28-104 28-104 0Z')}
      <path class="line" d="M317 427c48-3 49 53 0 49"/>
      ${area('saucer','M191 486h148c-14 29-134 29-148 0Z')}
      ${area('plant-pot','M548 420h66l-8 72h-50Z')}
      ${area('leaf1','M581 420c-47-28-27-77 2-43Z')}${area('leaf2','M581 420c6-53 55-53 30-3Z')}${area('leaf3','M581 420c-8-53-48-55-23-4Z')}
      <path class="line" d="M96 530h528"/><path class="detail" d="M243 441h43"/>
    `; }
    function sea() { return `
      ${area('sky','M66 66H654V386H66Z')}
      <circle class="color-area" data-id="sun" cx="526" cy="132" r="43"/>
      ${area('water','M66 386H654V506H66Z')}
      ${area('sand','M66 506H654V574H66Z')}
      ${area('sail-left','M354 176V382H255Z')}${area('sail-right','M354 207v175h97Z')}
      ${area('boat','M231 382h247l-40 73H272Z')}
      <path class="line" d="M354 157v225m-123 0h247M272 455h166"/>
      ${area('cloud1','M120 163c5-34 47-36 57-9 31-15 54 25 21 38h-82c-31-10-21-40 4-29Z')}
      ${area('cloud2','M330 113c4-29 39-31 48-8 28-13 47 22 18 33h-68c-26-8-18-35 2-25Z')}
      <path class="detail" d="M526 66v22m0 88v22m66-66h-22m-88 0h-22m93 43-16-16m-54-54-16-16m0 86-16 16m54-54 16-16"/>
      <path class="detail" d="M88 421c42-22 84 22 126 0s84 22 126 0 84 22 126 0 84 22 126 0m-504 43c42-22 84 22 126 0s84 22 126 0 84 22 126 0 84 22 126 0m-495 72c20-10 40 10 60 0s40 10 60 0m269 9 12 12m0-12-12 12"/>
    `; }
    function drawPage() { svg.innerHTML = pages[current].make(); document.getElementById('pageTitle').textContent = pages[current].name; document.querySelectorAll('.color-area').forEach(el => el.addEventListener('click', () => { el.style.fill = selected; })); }
    function drawPages() { const box=document.getElementById('pageList'); box.innerHTML=pages.map((p,i)=>`<button class="page-choice ${i===current?'active':''}" data-page="${i}"><span class="mini">${mini(p.icon)}</span><span>${p.name}</span></button>`).join(''); box.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=+b.dataset.page;drawPages();drawPage();}); }
    function mini(type) { return type==='flower'?'<svg viewBox="0 0 40 40"><path d="M20 35V21M20 21c-12-12 5-20 7-7 2-13 19-5 7 7 12 12-5 20-7 7-2 13-19 5-7-7Z"/><circle cx="20" cy="21" r="3"/></svg>':type==='cup'?'<svg viewBox="0 0 40 40"><path d="M8 13h20v13c0 7-20 7-20 0Z M28 16c9-1 8 11 0 9M5 29h27"/></svg>':'<svg viewBox="0 0 40 40"><circle cx="28" cy="11" r="6"/><path d="M4 25c7-4 14 4 21 0s8 4 12 0M4 31h32M18 30V16l-8 14m8-14 8 14"/></svg>'; }
    function drawSwatches() { const el=document.getElementById('swatches'); el.innerHTML=palette.map(c=>`<button class="swatch ${c===selected?'selected':''}" data-color="${c}" style="background:${c}" aria-label="Select ${c}"></button>`).join(''); el.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.color;drawSwatches();}); }
    document.getElementById('customColor').oninput=e=>{selected=e.target.value;drawSwatches();};
    document.getElementById('clearBtn').onclick=()=>document.querySelectorAll('.color-area').forEach(x=>x.style.fill='#fffefb');
    document.getElementById('resetBtn').onclick=()=>{ if(confirm('Start this page over?')) drawPage(); };
    drawPages(); drawSwatches(); drawPage();
  </script>
</body>
</html>
